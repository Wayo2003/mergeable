name: Mergeable

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

# Only run when Dependabot is the PR author.
# workflow_dispatch bypasses this filter so it can be triggered manually.
jobs:
  mergeable:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            demo-target/package-lock.json
            mcp-server/package-lock.json

      - name: Install demo-target dependencies
        run: npm ci
        working-directory: demo-target

      - name: Install MCP server dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Build MCP server
        run: npm run build
        working-directory: mcp-server

      - name: Install IBM Bob Shell
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash

      - name: Run Mergeable
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
          # Make the MCP server path portable: resolved relative to GITHUB_WORKSPACE
          MERGEABLE_MCP_PATH: ${{ github.workspace }}/mcp-server/dist/index.js
        run: |
          bob run \
            --mode mergeable \
            --format json \
            --max-turns 80 \
            "Make this dependency PR mergeable"

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mergeable-run-${{ github.run_id }}
          path: .mergeable/runs/
          if-no-files-found: warn

      - name: Post Upgrade Dossier summary as PR comment
        if: >
          github.event_name == 'pull_request' &&
          hashFiles('.mergeable/runs/**/pr-body.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Find the most recent pr-body.md under .mergeable/runs/
            // (`glob` is the @actions/glob helper injected by github-script)
            const globber = await glob.create('.mergeable/runs/**/pr-body.md');
            const files = (await globber.glob()).sort();
            if (files.length === 0) {
              core.warning('No pr-body.md found — skipping comment.');
              return;
            }
            const body = fs.readFileSync(files[files.length - 1], 'utf8');

            await github.rest.issues.createComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
